# =============================================================================
# Nginx Configuration — Frontend Reverse Proxy & SPA Serving
# =============================================================================
# Serves the React SPA static assets and proxies /api/* requests to the
# Spring Boot backend container, eliminating CORS issues.
#
# In Docker Compose, 'backend' resolves to the backend container via
# Docker's internal DNS. For local dev, adjust proxy_pass to localhost:8080.
# =============================================================================

server {
    listen 3000;
    server_name localhost;

    # Root directory for static React assets
    root /usr/share/nginx/html;
    index index.html;

    # --- Compression ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # --- SPA Client-Side Routing ---
    # Serve index.html for all non-file routes (React Router handles routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API Reverse Proxy ---
    # Forwards /api/* requests to the Spring Boot backend container.
    # Strips nothing — the backend expects /api/v1/* paths.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings for long-running AI operations
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --- Actuator Health Proxy (optional monitoring) ---
    location /actuator/ {
        proxy_pass http://backend:8080/actuator/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # --- Static Asset Caching ---
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
